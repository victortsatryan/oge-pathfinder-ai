name: Pathy tests, TypeScript and production build

on:
  push:
    branches:
      - main
      - feat/extractor-topic-lesson-linking-20261107
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pathy-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly the locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run Pathy extractor integration tests
        run: npx vitest run --config vitest.extractor.config.ts
      - name: Generate routes with the declared TanStack CLI
        run: npx tsr generate
      - name: Typecheck all application code
        run: npx tsc -b --noEmit
      - name: Build production application
        run: npm run build
