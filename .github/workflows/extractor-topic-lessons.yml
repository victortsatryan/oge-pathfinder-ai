name: Extractor topic lesson integration checks
on:
  push:
    branches:
      - feat/extractor-topic-lesson-linking-20261107
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx vitest run --config vitest.extractor.config.ts
      - run: npx tsc -b --noEmit
